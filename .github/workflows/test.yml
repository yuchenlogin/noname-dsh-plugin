name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install kernel test deps
        run: python -m pip install pytest
      - name: Plugin tests (real kernel)
        run: npm test
      - name: Kernel tests
        run: cd vendor/noname-harness && python -m pytest -q
