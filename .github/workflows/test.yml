name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Kernel snapshot check
        run: npm run check:kernel
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Plugin tests (real kernel, end to end)
        run: npm test
      # The plugin drives the vendored snapshot at runtime.  The submodule is
      # the source used by check:kernel; this smoke test exercises the exact
      # package that npm users receive.
      - name: Kernel import + ping smoke (vendored runtime contract)
        run: |
          PYTHONPATH=vendor/noname_harness_pkg python -c "import noname_harness; from noname_harness.store import HarnessStore; print('kernel import OK:', noname_harness.__name__)"

